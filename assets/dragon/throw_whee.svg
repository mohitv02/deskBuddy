    <style>
        .outline { stroke: #2B0E63; stroke-width: 16; stroke-linejoin: round; stroke-linecap: round; }
        .red-fill { fill: #FF3355; }
        .cream-fill { fill: #FFE0AC; }
        .white-fill { fill: #FFFFFF; }
        .dark-fill { fill: #180838; }
        .shadow-fill { fill: #CD8EC9; }

        #dragon-group { transform-origin: 400px 450px; animation: fly-hover 1.2s ease-in-out infinite alternate; }
        #shadow { transform-origin: 400px 750px; transform: scale(0.5); opacity: 0.2; }
        
        #left-wing { transform-origin: 320px 480px; animation: flap-left 0.12s ease-in-out infinite alternate; }
        #right-wing { transform-origin: 480px 480px; animation: flap-right 0.12s ease-in-out infinite alternate; }

        @keyframes fly-hover {
            0% { transform: translateY(-40px); }
            100% { transform: translateY(-70px); }
        }
        @keyframes flap-left {
            0% { transform: rotate(15deg); }
            100% { transform: rotate(50deg); }
        }
        @keyframes flap-right {
            0% { transform: rotate(-15deg); }
            100% { transform: rotate(-50deg); }
        }
    </style>

