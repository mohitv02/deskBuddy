<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
    <style>
        .outline { stroke: #2B0E63; stroke-width: 16; stroke-linejoin: round; stroke-linecap: round; }
        .red-fill { fill: #FF3355; }
        .cream-fill { fill: #FFE0AC; }
        .white-fill { fill: #FFFFFF; }
        .dark-fill { fill: #180838; }
        .shadow-fill { fill: #CD8EC9; }

        #dragon-group { transform-origin: 400px 450px; animation: fly-hover 1.2s ease-in-out infinite alternate; }
        #shadow { transform-origin: 400px 750px; transform: scale(0.5); opacity: 0.2; }
        
        #left-wing { transform-origin: 320px 480px; animation: flap-left 0.12s ease-in-out infinite alternate; }
        #right-wing { transform-origin: 480px 480px; animation: flap-right 0.12s ease-in-out infinite alternate; }

        @keyframes fly-hover {
            0% { transform: translateY(-40px); }
            100% { transform: translateY(-70px); }
        }
        @keyframes flap-left {
            0% { transform: rotate(15deg); }
            100% { transform: rotate(50deg); }
        }
        @keyframes flap-right {
            0% { transform: rotate(-15deg); }
            100% { transform: rotate(-50deg); }
        }
    </style>

    <g id="shadow"><ellipse cx="400" cy="730" rx="140" ry="20" class="shadow-fill" /></g>

    <g id="dragon-group">
        <g id="tail" class="outline">
            <path class="red-fill" d="M 450, 600 C 600, 600 680, 720 620, 740 C 580, 750 520, 680 430, 660 Z" />
            <polygon class="cream-fill" points="540,650 570,620 590,660" />
            <polygon class="cream-fill" points="600,690 640,670 630,710" />
        </g>
        <g id="wings">
            <g id="left-wing" class="outline">
                <path class="cream-fill" d="M 330, 520 C 220, 460 150, 480 140, 530 C 180, 560 210, 550 220, 520 C 240, 570 270, 580 300, 550 Z" />
                <path class="red-fill" d="M 330, 520 C 220, 460 150, 480 140, 530 C 190, 450 270, 460 340, 520 Z" />
            </g>
            <g id="right-wing" class="outline">
                <path class="cream-fill" d="M 470, 520 C 580, 460 650, 480 660, 530 C 620, 560 590, 550 580, 520 C 560, 570 530, 580 500, 550 Z" />
                <path class="red-fill" d="M 470, 520 C 580, 460 650, 480 660, 530 C 610, 450 530, 460 460, 520 Z" />
            </g>
        </g>
        <g id="horns" class="outline">
            <path class="red-fill" d="M 280, 240 C 240, 150 190, 130 190, 130 C 190, 130 200, 200 240, 260 Z" />
            <path class="cream-fill" d="M 265, 230 C 235, 160 210, 145 210, 145 C 210, 145 215, 195 245, 240 Z" />
            <path class="red-fill" d="M 520, 240 C 560, 150 610, 130 610, 130 C 610, 130 600, 200 560, 260 Z" />
            <path class="cream-fill" d="M 535, 230 C 565, 160 590, 145 590, 145 C 590, 145 585, 195 555, 240 Z" />
        </g>
        <g id="body" class="outline">
            <path class="red-fill" d="M 310, 620 C 280, 620 270, 670 290, 690 C 310, 710 360, 700 360, 670 Z" />
            <path class="cream-fill" stroke-width="10" d="M 295, 680 L 305, 690 M 315, 685 L 325, 695 M 335, 680 L 345, 690" />
            <path class="red-fill" d="M 490, 620 C 520, 620 530, 670 510, 690 C 490, 710 440, 700 440, 670 Z" />
            <path class="cream-fill" stroke-width="10" d="M 505, 680 L 495, 690 M 485, 685 L 475, 695 M 465, 680 L 455, 690" />
            <path class="red-fill" d="M 330, 480 C 280, 580 320, 670 370, 670 L 430, 670 C 480, 670 520, 580 470, 480 Z" />
            <path class="cream-fill" d="M 355, 500 C 330, 570 350, 650 380, 650 L 420, 650 C 450, 650 470, 570 445, 500 Z" />
        </g>
        <g id="head">
            <path class="outline red-fill" d="M 400, 160 C 570, 160 630, 240 630, 370 C 630, 480 520, 510 400, 510 C 280, 510 170, 480 170, 370 C 170, 240 230, 160 400, 160 Z" />
            <g id="forehead-spikes" class="outline cream-fill">
                <polygon points="400,150 415,175 400,195 385,175" />
                <polygon points="400,205 415,230 400,250 385,230" />
                <polygon points="400,260 415,285 400,305 385,285" />
            </g>
            <ellipse cx="240" cy="410" rx="30" ry="15" fill="#FF8521" opacity="0.4" />
            <ellipse cx="560" cy="410" rx="30" ry="15" fill="#FF8521" opacity="0.4" />
            <g id="eyes">
                <g id="left-eye"><circle cx="280" cy="350" r="45" class="dark-fill" stroke="none" /><circle cx="295" cy="330" r="18" class="white-fill" stroke="none" /><circle cx="260" cy="365" r="8" class="white-fill" stroke="none" /></g>
                <g id="right-eye"><circle cx="520" cy="350" r="45" class="dark-fill" stroke="none" /><circle cx="505" cy="330" r="18" class="white-fill" stroke="none" /><circle cx="540" cy="365" r="8" class="white-fill" stroke="none" /></g>
            </g>
            <g id="nose" class="dark-fill" stroke="none">
                <ellipse cx="385" cy="390" rx="3" ry="5" />
                <ellipse cx="415" cy="390" rx="3" ry="5" />
            </g>
            <g id="mouth-idle">
                <path class="outline dark-fill" fill="none" d="M 385, 410 Q 400, 425 415, 410" stroke-width="10" />
            </g>
        </g>
        <g id="arms" class="outline">
            <path id="arm-left" class="red-fill" d="M 320, 490 C 270, 520 280, 570 310, 580 C 340, 590 360, 550 345, 520 Z" />
            <path id="arm-right" class="red-fill" d="M 480, 490 C 530, 520 520, 570 490, 580 C 460, 590 440, 550 455, 520 Z" />
        </g>
    </g>
</svg>
