    <style>
        .outline { stroke: #2B0E63; stroke-width: 16; stroke-linejoin: round; stroke-linecap: round; }
        .red-fill { fill: #FF3355; }
        .cream-fill { fill: #FFE0AC; }
        .white-fill { fill: #FFFFFF; }
        .dark-fill { fill: #180838; }
        .shadow-fill { fill: #CD8EC9; }

        #shadow { transform-origin: 400px 750px; animation: shadow-idle 3s ease-in-out infinite alternate; }
        #dragon-group { transform-origin: 400px 450px; animation: float-idle 3s ease-in-out infinite alternate; }
        #mouth-big-smile { transform-origin: 400px 410px; animation: scale-bounce 1.5s ease-in-out infinite alternate; }

        /* Hide other states */
        #mouth-idle, #mouth-sad, #mouth-open, #sad-brows, #tears, #sad-eyelids, #fireball-container { display: none; }

        @keyframes float-idle {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-15px); }
        }
        @keyframes shadow-idle {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }
        @keyframes scale-bounce {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }
    </style>

    <g id="shadow">
        <ellipse cx="400" cy="730" rx="140" ry="20" class="shadow-fill" opacity="0.8" />
    </g>

    <g id="dragon-group">
        <g id="tail" class="outline">
