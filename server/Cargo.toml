[package]
name = "deskbuddy-chat-server"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/mohitv02/desktopPet"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
dotenvy = "0.15.7"
ed25519-dalek = "2.2.0"
futures-util = "0.3.34"
getrandom = "0.3"
mdns-sd = "0.13"
mongodb = "3.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
